replicaCount: 1

image:
  repository: nginx
  tag: "1.27.5"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

# Optional: set a real worker-node label if targeting one specific node.
nodeSelector: {}

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi
